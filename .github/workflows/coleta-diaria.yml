name: Coleta diária

on:
  schedule:
    # 06:37 UTC = 03:37 de Brasília: depois da regeneração do lote da Câmara (por volta de
    # 02h21) e fora do topo da hora, quando o agendador do GitHub mais atrasa.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      aceitar_variacao:
        description: "Aceito esta variação do estoque bruto (só para esta execução)"
        type: boolean
        default: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # O setup-uv não publica tag móvel de versão maior (v10 não existe): fixa-se a versão completa.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - name: Identidade do bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Coleta e commit
        shell: bash
        run: |
          uv run python -m monitor_comissoes.diaria executar
          git add data/atual.json data/status.json
          git commit -m "$(uv run python -m monitor_comissoes.diaria mensagem)"
          git pull --rebase
          git push origin HEAD:${GITHUB_REF_NAME}
